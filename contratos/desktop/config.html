<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Configuração</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, "Segoe UI", sans-serif; display: flex; justify-content: center; padding: 48px 16px; background: Canvas; color: CanvasText; }
  main { width: 520px; max-width: 100%; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { opacity: .7; margin-bottom: 24px; }
  .op { border: 1px solid #8884; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; display: block; }
  .op:has(input:checked) { border-color: #2358d6; box-shadow: 0 0 0 1px #2358d6; }
  .op b { display: block; } .op span { opacity: .7; font-size: 13px; }
  .campos { margin: 10px 0 0 24px; } label.c { display: block; font-size: 12px; font-weight: 600; margin-top: 8px; }
  input[type=text], input[type=password], input[type=number] { width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #8886; border-radius: 6px; font: inherit; background: Field; color: FieldText; }
  button { margin-top: 16px; background: #2358d6; color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; } #msg { margin-top: 12px; padding: 8px 10px; border-radius: 6px; display: none; }
  #msg.erro { display: block; background: #fde6e4; color: #a01e15; } #msg.ok { display: block; background: #e3f5ea; color: #17673e; }
  .ips { font-family: ui-monospace, Consolas, monospace; margin-top: 6px; font-size: 13px; }
</style></head>
<body><main>
  <h1>Controle de Contratos</h1>
  <div class="sub">Escolha como este computador vai funcionar.</div>
  <label class="op"><input type="radio" name="modo" value="servidor"> <b style="display:inline">Este computador é o servidor</b>
    <span>Guarda o banco de dados e atende os demais. Deve ficar ligado durante o expediente. Só um computador da rede faz isso.</span>
    <div class="campos" id="c-servidor">
      <label class="c">Porta <input type="number" id="porta" value="3210" min="1024" max="65535"></label>
      <label class="c">Código de acesso (opcional) <input type="password" id="codigo" autocomplete="off"></label>
      <div class="ips" id="ips"></div>
    </div></label>
  <label class="op"><input type="radio" name="modo" value="cliente"> <b style="display:inline">Conectar a um servidor da rede</b>
    <span>Use nos demais computadores. Informe o endereço mostrado no computador servidor.</span>
    <div class="campos" id="c-cliente"><label class="c">Endereço do servidor <input type="text" id="endereco" placeholder="http://192.168.0.10:3210" autocomplete="off"></label></div></label>
  <button id="ok">Continuar</button>
  <div id="msg"></div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const msg = (t, k) => { const m = $('#msg'); m.className = k; m.textContent = t; };
  const atualizar = () => {
    const modo = document.querySelector('input[name=modo]:checked')?.value;
    $('#c-servidor').style.display = modo === 'servidor' ? 'block' : 'none';
    $('#c-cliente').style.display = modo === 'cliente' ? 'block' : 'none';
    $('#ok').disabled = !modo;
  };
  document.querySelectorAll('input[name=modo]').forEach((r) => r.addEventListener('change', atualizar));
  (async () => {
    const { config, enderecos } = await window.config.ler();
    if (config) {
      document.querySelector(`input[name=modo][value=${config.modo}]`).checked = true;
      $('#porta').value = config.porta || 3210; $('#codigo').value = config.codigo || ''; $('#endereco').value = config.endereco || '';
    }
    if (enderecos.length) $('#ips').textContent = 'Endereços para os outros PCs: ' + enderecos.join('  ');
    const erro = new URLSearchParams(location.search).get('erro'); if (erro) msg(erro, 'erro');
    atualizar();
  })();
  $('#ok').onclick = async () => {
    const modo = document.querySelector('input[name=modo]:checked').value;
    $('#ok').disabled = true; msg('Conectando…', 'ok');
    if (modo === 'cliente') {
      const t = await window.config.testar($('#endereco').value.match(/^https?:/) ? $('#endereco').value : 'http://' + $('#endereco').value);
      if (!t.ok) { msg(t.erro, 'erro'); $('#ok').disabled = false; return; }
    }
    const r = await window.config.salvar({ modo, porta: $('#porta').value, codigo: $('#codigo').value, endereco: $('#endereco').value.trim() });
    if (!r.ok) { msg(r.erro, 'erro'); $('#ok').disabled = false; }
  };
</script></body></html>
